<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your project · Meji Builds</title>
  <meta name="theme-color" content="#eeebe5" />
  <meta name="color-scheme" content="light dark" />
  <script>
    (function () {
      try {
        var t = null;
        try { t = localStorage.getItem("mb_theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" type="image/png" href="/brand/logo-sm.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="/brand/logo-sm-dark.png" media="(prefers-color-scheme: dark)" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark">M</span>
      <span class="name">Meji Builds<small id="clientName">Your project</small></span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="btn ghost sm" id="logout">Sign out</button>
    </div>
  </header>

  <main class="main bare">
    <div class="page mid">

      <div id="loading">
        <div class="skel" style="height:150px;border-radius:20px;margin-bottom:16px"></div>
        <div class="skel" style="height:260px;border-radius:14px"></div>
      </div>

      <div id="denied" class="hidden">
        <div class="notice bad">
          <span class="ico"><i data-icon="alert"></i></span>
          <div><strong>We couldn't open this project.</strong><br />
          Use the link we emailed you, or ask us to send a fresh one.</div>
        </div>
      </div>

      <div id="main" class="hidden stack">
        <div id="dealTabs" class="seg hidden"></div>
        <div id="summary"></div>

        <div class="card">
          <div class="card-head">
            <h2>Conversation with Meji Builds</h2>
            <span class="sub">Usually replies same day</span>
          </div>
          <div class="thread" id="thread"></div>
          <div class="composer">
            <textarea id="msgBox" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
            <button class="btn icon" id="send" aria-label="Send message"><i data-icon="send"></i></button>
          </div>
        </div>

        <div class="card hidden" id="paymentsPanel">
          <div class="card-head"><h2>Payments</h2></div>
          <div id="paymentsList"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="/common.js"></script>
<script src="/theme.js"></script>
<script src="/client.js"></script>
</body>
</html>
