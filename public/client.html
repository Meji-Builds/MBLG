<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your project · Meji Builds</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="mark">M</span>
      <span class="name">Meji Builds<small id="clientName">Your project</small></span>
    </div>
    <button class="btn quiet sm" id="logout">Sign out</button>
  </header>

  <main class="main bare">
    <div class="page mid">

      <div id="loading">
        <div class="skel" style="height:150px;border-radius:20px;margin-bottom:16px"></div>
        <div class="skel" style="height:260px;border-radius:14px"></div>
      </div>

      <div id="denied" class="hidden">
        <div class="notice bad">
          <span class="ico"><i data-icon="alert"></i></span>
          <div><strong>We couldn't open this project.</strong><br />
          Use the link we emailed you, or ask us to send a fresh one.</div>
        </div>
      </div>

      <div id="main" class="hidden stack">
        <div id="dealTabs" class="seg hidden"></div>
        <div id="summary"></div>

        <div class="card">
          <div class="card-head">
            <h2>Conversation with Meji Builds</h2>
            <span class="sub">Usually replies same day</span>
          </div>
          <div class="thread" id="thread"></div>
          <div class="composer">
            <textarea id="msgBox" rows="1" placeholder="Write a message…" aria-label="Message"></textarea>
            <button class="btn icon" id="send" aria-label="Send message"><i data-icon="send"></i></button>
          </div>
        </div>

        <div class="card hidden" id="paymentsPanel">
          <div class="card-head"><h2>Payments</h2></div>
          <div id="paymentsList"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="/common.js"></script>
<script src="/client.js"></script>
</body>
</html>
